<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1746c4"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Dream League Crib</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4fc;--panel:#fff;--ink:#0d1536;--mute:#5a638c;--line:#d4daf0;--acc:#e0202f;--on:#fff;--hi:#1746c4;--hion:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f2e;--panel:#141b4a;--ink:#eef0ff;--mute:#9aa4d8;--line:#2b377c;--acc:#ff4d6a;--on:#0a0f2e;--hi:#7aa2ff;--hion:#0a0f2e;}}
:root[data-theme="dark"]{--bg:#0a0f2e;--panel:#141b4a;--ink:#eef0ff;--mute:#9aa4d8;--line:#2b377c;--acc:#ff4d6a;--on:#0a0f2e;--hi:#7aa2ff;--hion:#0a0f2e;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(90deg,#0f3fbf 0%,#5a2a9c 50%,#e02a5a 100%);color:#fff;padding:22px 0 14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:60px;height:60px;flex:none;border-radius:16px;border:2px solid #fff}.ann{border-left:6px solid var(--acc)}.ann div:first-child{white-space:pre-wrap}.b.wa{display:inline-block;text-decoration:none;margin-right:8px}.spot{display:flex;gap:14px;align-items:center;margin:12px 0}.spot img{width:130px;border-radius:10px;flex:none}
h1{font:400 clamp(42px,11vw,68px)/1 'Bebas Neue',Impact,sans-serif;margin:0;letter-spacing:.02em}
header p{margin:4px 0 14px;opacity:.9}
nav{display:flex;gap:6px}
.tab{flex:1;background:rgba(0,0,0,.25);color:#fff;border:0;border-radius:8px 8px 0 0;padding:10px 2px;font:600 13px Barlow,system-ui,sans-serif;cursor:pointer}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
main{padding-bottom:40px}
h2{font:400 30px/1.1 'Bebas Neue',Impact,sans-serif;margin:20px 0 4px}
h3{margin:0;font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.mute{color:var(--mute);font-size:15px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:10px 16px;font:600 15px Barlow,system-ui,sans-serif;cursor:pointer;margin-top:12px}
.b.sm{padding:4px 10px;margin:0 0 0 8px;font-size:13px}
.b.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 10px;font-size:13px;margin-left:8px}
.match{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.pl.win{font-weight:600;border-bottom:3px solid var(--hi)}
.rd{font-weight:600;margin-top:12px}
.bk{overflow-x:auto;padding:6px 0 12px;margin-top:8px}.bki{display:flex;width:max-content;margin:0 auto}.col{flex:0 0 160px;display:flex;flex-direction:column}.ch{height:26px;font-size:12px;color:var(--mute);text-align:center;font-weight:600}.sl{display:flex;flex-direction:column}.slot{flex:1;display:flex;align-items:center;position:relative;padding:3px 12px}
.bm{width:136px}.br{display:flex;align-items:center;gap:4px;margin:2px 0;font-size:13px}.br.win .nm{background:var(--hi);color:var(--hion);border-color:var(--hi);font-weight:700}.br.tbd .nm{color:var(--mute)}.nm{flex:1;min-width:0;height:26px;line-height:24px;box-sizing:border-box;padding:0 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb{flex:0 0 auto;min-width:28px;min-height:26px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:13px;padding:0 4px}.champ{text-align:center;font-weight:700;margin-top:10px;font-size:14px}
.slot::before,.slot::after{content:'';position:absolute;border:0 solid var(--line)}
.L:not(.f) .slot::before{left:0;width:12px;top:50%;border-top-width:2px}.L:not(.e) .slot::after{right:0;width:12px;border-right-width:2px}.L:not(.e) .up::after{top:50%;bottom:0;border-top-width:2px}.L:not(.e) .lo::after{top:0;bottom:50%;border-bottom-width:2px}.L.e .slot::after{right:0;width:12px;top:50%;border-top-width:2px}
.R:not(.f) .slot::before{right:0;width:12px;top:50%;border-top-width:2px}.R:not(.e) .slot::after{left:0;width:12px;border-left-width:2px}.R:not(.e) .up::after{top:50%;bottom:0;border-top-width:2px}.R:not(.e) .lo::after{top:0;bottom:50%;border-bottom-width:2px}.R.e .slot::after{left:0;width:12px;top:50%;border-top-width:2px}
.fc .slot::before{left:0;width:12px;top:50%;border-top-width:2px}.fc .slot::after{right:0;width:12px;top:50%;border-top-width:2px}.fc.solo .slot::before,.fc.solo .slot::after{display:none}
.sc,.si{flex:0 0 auto;box-sizing:border-box;min-width:30px;height:26px;border:1px solid var(--line);border-radius:5px;text-align:center;font-weight:700;font-size:14px;line-height:24px;padding:0 4px;background:var(--bg);color:var(--ink)}.si{width:34px;padding:0;-moz-appearance:textfield;border-color:var(--hi)}.sc sup{font-size:10px;margin-left:1px}
.bf{display:flex;align-items:center;gap:4px;margin-top:3px}.pe{display:flex;gap:3px}.pe[hidden]{display:none}.bf .b{margin:0 0 0 auto;padding:2px 8px;font-size:12px;min-height:26px}.bf .b.x{padding:0;min-width:24px;margin-left:0}.pe .si{width:28px}.st{font-size:12px;color:var(--mute)}.edt{border:1px solid var(--hi);border-radius:10px;padding:10px 12px;margin-top:10px}.rep{border-top:1px solid var(--line);padding:8px 0}.rep .b.sm{margin:6px 8px 0 0}
.post{border-left:6px solid var(--hi)}.post h3{margin:6px 0 2px}.post .body{white-space:pre-wrap}.cm{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.cbar{margin-top:10px}.crow{display:flex;gap:8px;align-items:flex-end}.ci{flex:1;min-width:0;min-height:40px;max-height:110px;resize:none;border-radius:20px;padding:9px 14px;line-height:20px;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);box-sizing:border-box}.sendb{flex:0 0 auto;border-radius:20px;min-height:40px;padding:0 18px;margin:0}
.rp{display:flex;align-items:center;gap:8px;border-left:4px solid var(--hi);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:13px}.rp[hidden]{display:none}.rp .t{flex:1;min-width:0}.rp .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rp button{border:0;background:none;color:var(--ink);font-size:16px;min-width:32px;min-height:32px}
.c{position:relative;touch-action:pan-y}.c .swi{position:absolute;left:-32px;top:50%;margin-top:-12px;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:var(--hi);color:var(--hion);opacity:var(--sw,0);pointer-events:none}.c.hl{background:var(--line)}
.quote{border-left:4px solid var(--hi);background:var(--bg);border-radius:6px;padding:4px 8px;margin:4px 0;font-size:13px;cursor:pointer}.quote div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ctext{white-space:pre-wrap;word-break:break-word}.cact{margin-top:2px}.lnk{border:0;background:none;color:var(--mute);font-size:13px;padding:6px 14px 6px 0;min-height:32px;cursor:pointer}.cm .c{padding:6px 0;border-bottom:1px solid var(--line)}.cm .c b{font-size:14px}.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:12px 0 0}.chk input{width:auto}
#banner,#toast{background:var(--hi);color:var(--hion);padding:10px 14px;border-radius:8px;margin:12px 0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:688px;margin:0 auto}
</style></head><body>
